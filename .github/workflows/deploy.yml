name: 博客自动构建部署

on:
  push:
    branches: [ source ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0

    - name: 📦 设置 Node.js 环境
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: 🔧 安装依赖
      run: |
        npm ci
        npm install -g hexo-cli

    - name: ⚡ 安装性能优化插件
      run: |
        npm install --no-save hexo-html-minifier hexo-clean-css hexo-uglify hexo-generator-robotstxt

    - name: 🚀 清理并生成静态文件
      run: |
        hexo clean
        NODE_ENV=production hexo generate

    - name: 🌐 部署到 GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: main
        publish_dir: ./public
        cname: cakee.eu.org
        force_orphan: true
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        commit_message: '🚀 Deploy blog via GitHub Actions'
